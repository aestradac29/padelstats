      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      .dark ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
      .dark ::-webkit-scrollbar-thumb { background: #1e293b; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #334155; }
      /* Fix double arrow in selects */
      .custom-select {
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        appearance: none !important;
        background-image: none !important;
      }
      /* Hide scrollbar utility */
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      /* Smooth page transitions */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-in { animation: fadeSlideIn 0.25s ease both; }
      .fade-in    { animation-name: fadeSlideIn; }
      /* Bottom nav safe area for iOS */
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    </style>
